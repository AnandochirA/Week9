<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What Personality Type Are You?</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <header class="text-center mb-5">
      <h1 class="display-5 fw-bold">What Personality Type Are You?</h1>
      <p class="lead text-muted">Answer 4 quick questions to discover your type.</p>
    </header>

    <!-- Start quiz element -->
    <section class="question-block card shadow-sm mb-4" data-question="1">
      <div class="card-body">
        <h2 class="h5 mb-3">1. It's a free Saturday. What do you do?</h2>
        <div class="d-grid gap-2">
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="1">Plan a project or study something new</button>
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="2">Make something: draw, write, or play music</button>
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="3">Organize a get-together with friends</button>
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="4">Head out on a spontaneous adventure</button>
        </div>
      </div>
    </section>

    <section class="question-block card shadow-sm mb-4" data-question="2">
      <div class="card-body">
        <h2 class="h5 mb-3">2. In a group project, you are usually the one who...</h2>
        <div class="d-grid gap-2">
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="1">Researches and analyzes the details</button>
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="2">Comes up with the creative ideas</button>
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="3">Assigns tasks and keeps everyone on track</button>
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="4">Tries the risky, untested approach</button>
        </div>
      </div>
    </section>

    <section class="question-block card shadow-sm mb-4" data-question="3">
      <div class="card-body">
        <h2 class="h5 mb-3">3. Pick a dream vacation.</h2>
        <div class="d-grid gap-2">
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="1">A quiet library town with great museums</button>
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="2">An art-filled city with galleries and cafes</button>
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="3">A big resort where I can host the whole crew</button>
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="4">Backpacking through remote mountains</button>
        </div>
      </div>
    </section>

    <section class="question-block card shadow-sm mb-4" data-question="4">
      <div class="card-body">
        <h2 class="h5 mb-3">4. How do you handle a big decision?</h2>
        <div class="d-grid gap-2">
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="1">Weigh every pro and con carefully</button>
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="2">Go with what feels right</button>
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="3">Decide quickly and take charge</button>
          <button class="answer-btn btn btn-outline-primary text-start" data-answer="4">Jump in and figure it out as I go</button>
        </div>
      </div>
    </section>
    <!-- End quiz element -->

    <div class="text-center mb-4">
      <button id="show-results" class="btn btn-primary btn-lg px-5">Show Results</button>
    </div>

    <div id="result-container" class="text-center" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
